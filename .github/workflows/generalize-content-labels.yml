name: Generalize reading content labels

on:
  push:
    paths:
      - '.github/workflows/generalize-content-labels.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update visible labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            '<title>タイトル問題</title>':'<title>長文概要把握ライティング</title>',
            '<small>READING LAB / EIKEN PRE-2</small><h1>タイトルを考える</h1>':'<small>READING LAB</small><h1>長文概要把握ライティング</h1>',
            '英検過去問から抽出した教材。AIの判定は学習の参考として活用してください。':'長文読解教材。AIの判定は学習の参考として活用してください。',
            "$('meta').textContent=`${p.year}年度 第${p.session}回 / 準２級`;":"$('meta').textContent=`Reading ${String(index+1).padStart(2,'0')}`;",
            "$('source').textContent=`出典：${p.source_file} p.${p.source_page} · 解答：${p.answer_status==='official_verified'?'公式解答照合済み':'文脈から推定'}`;":"$('source').textContent='';",
            "${String(i+1).padStart(2,'0')} · ${p.year}年度 第${p.session}回":"${String(i+1).padStart(2,'0')}",
          }
          missing=[]
          for old,new in replacements.items():
              if old not in s:
                  missing.append(old)
              else:
                  s=s.replace(old,new,1)
          if missing:
              raise SystemExit('targets not found: '+repr(missing))
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Generalize summary content labels"
          git push
