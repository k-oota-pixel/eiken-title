name: Rename browser tab title

on:
  push:
    paths:
      - '.github/workflows/rename-tab-title.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename browser tab title
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<title>Reading Lab</title>'
          new = '<title>タイトル問題</title>'
          if old not in s:
              raise SystemExit('Expected title not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Rename browser tab title to タイトル問題"
          git push
