name: Add Monstudy home link

on:
  push:
    paths:
      - '.github/workflows/add-monstudy-home.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Monstudy home link
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '←もんすたでぃ' not in s:
              style='''<style id="monstudy-home-style">\n.monstudy-home-wrap{width:min(calc(100% - 28px),1000px);margin:10px auto 0;position:relative;z-index:20}.monstudy-home-link{display:inline-flex;align-items:center;text-decoration:none;color:#385a4e;background:#fff;border:1px solid #d6e1d8;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;line-height:1.2;box-shadow:0 2px 8px #203b3608}.monstudy-home-link:hover{background:#f2f6f3}.monstudy-home-link:focus-visible{outline:3px solid #e4af37;outline-offset:3px}\n</style>\n'''
              if '</head>' in s: s=s.replace('</head>',style+'</head>',1)
              body='<div class="monstudy-home-wrap"><a class="monstudy-home-link" href="https://k-oota-pixel.github.io/english-playroom/" aria-label="もんすたでぃトップへ戻る">←もんすたでぃ</a></div>\n'
              if '<body>' in s: s=s.replace('<body>','<body>\n'+body,1)
              elif '<body ' in s:
                  i=s.find('>',s.find('<body ')); s=s[:i+1]+'\n'+body+s[i+1:]
              else: raise SystemExit('body tag not found')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Monstudy home link"
          git push
