function showFeedback(id,item){const ratings={correct:'正解',acceptable:'文脈に合っています',almost:'あと少し',incorrect:'もう一度考えよう',excellent:'内容をよく捉えています',good:'よく捉えています',partial:'もう少し全体を捉えよう',off_topic:'本文の中心に戻って考えよう'};const good=['correct','acceptable','excellent','good'].includes(item.verdict),warn=['almost','partial'].includes(item.verdict);$(id).innerHTML=`<div class="feedback ${good?'good':warn?'warn':'bad'}"><strong>${esc(ratings[item.verdict]||'フィードバック')}</strong><p>${esc(item.feedback||'')}</p>${item.suggestion?'<p>表現例：'+esc(item.suggestion)+'</p>':''}</div>`;}
let titleOwner='';function titleEvent(e){e.expectedUid=titleOwner;window.EnglishPlayroomCoins?.recordTitleEvent?.(IS_TITLE?'eiken-title':'eiken-cloze',e);}
async function askServer(p,payload){
  const body=IS_TITLE
    ? {passage_id:p.id,student_title:payload.student_title}
    : {passage_id:p.id,answers:payload.answers.map(a=>({number:a.number,answer:a.answer}))};
  const response=await fetch('https://eiken-title.onrender.com/api/grade',{
    method:'POST',
    headers:await (await import('./firebase-security.js?v=2.1.2')).apiHeaders(),
    body:JSON.stringify(body),
    signal:AbortSignal.timeout(60000)
  });
  let result={};
  try{result=await response.json();}catch{}
  if(!response.ok)throw new Error(result.error||`判定できませんでした（${response.status}）。`);
  return result;
}
$('check').onclick=async()=>{if(busy)return;titleOwner=window.EnglishPlayroomCoins?.getUserId?.()||'';const p=DATA[index];$('result').innerHTML='';let payload;if(IS_TITLE){const title=$('titleAnswer').value.trim();if(!title){$('result').textContent='タイトルを入力してください。';return;}payload={passage:p.text_completed,student_title:title};}else if(mode==='choice'){if(p.questions.some(q=>!answers[q.number])){$('result').textContent='すべての空所の選択肢を選んでください。';return;}let count=0;for(const q of p.questions){const correct=answers[q.number]===q.answer_number;if(correct)count++;showFeedback('feedback'+q.number,{verdict:correct?'correct':'incorrect',feedback:`解答：${q.answer_number}. ${q.answer_text}`});}$('result').textContent=`${p.questions.length}問中${count}問正解`;titleEvent({kind:'passage',itemId:p.id,grade:p.grade,mode:'choice',results:p.questions.map(q=>({id:q.number,correct:answers[q.number]===q.answer_number}))});window.readingLabCloud?.recordAttempt?.({passageId:p.id,total:p.questions.length,correct:count,mode:'choice'});return;}else{const a=p.questions.map(q=>({number:q.number,answer:$('answer'+q.number).value.trim(),reference_answer:q.answer_text}));if(a.some(q=>!q.answer)){$('result').textContent='すべての空所に英語を入力してください。';return;}payload={passage:p.text_with_blanks,answers:a};}
busy=true;document.querySelectorAll('#check,#passageSelect,#previous,#next,#free,#choice').forEach(x=>x.disabled=true);$('result').textContent='Geminiが内容を確認しています…';try{const task=IS_TITLE?'あなたは高校の英語読解の先生。生徒が文章全体のコアメッセージを捉えたタイトルを作れたか評価。元のタイトルとの一致は不要。日本語も英語も認める。文章全体をまとめているか、具体性、過度な一般化、事実との整合を評価。JSON形式 {"verdict":"excellent|good|partial|off_topic","feedback":"良い点と改善点を2〜3文","suggestion":"改善したタイトル例"}。': 'あなたは高校英語の先生。各空所について前後の文脈・文法・意味・自然さを評価。reference_answerは参考であり、一致しなくても成立する別解をacceptableとして認める。軽微な綴りミスはalmostとし修正を提案。文意を変える回答はincorrect。各空所の日本語の理由を簡潔に説明。JSON形式 {"results":[{"number":空所番号,"verdict":"correct|acceptable|almost|incorrect","feedback":"判定理由と修正点","suggestion":"自然な表現例"}]}。';const result=await askServer(p,payload);if(IS_TITLE){if(!['excellent','good','partial','off_topic'].includes(result.verdict)||typeof result.feedback!=='string')throw new Error('判定結果の形式が不正です。再試行してください。');titleEvent({kind:'answer',itemId:p.id,grade:p.grade,correct:['excellent','good'].includes(result.verdict),answer:payload.student_title});showFeedback('result',result);$('reveal').classList.remove('hidden');window.readingLabCloud?.recordAttempt?.({passageId:p.id,verdict:result.verdict,mode:'title'});}else{if(!Array.isArray(result.results)||p.questions.some(q=>!result.results.some(r=>r.number===q.number&&['correct','acceptable','almost','incorrect'].includes(r.verdict)&&typeof r.feedback==='string')))throw new Error('判定結果が不足しています。再試行してください。');$('result').textContent='判定が完了しました。';for(const q of p.questions)showFeedback('feedback'+q.number,result.results.find(r=>r.number===q.number));}}catch(e){$('result').textContent=e.message;}finally{busy=false;document.querySelectorAll('#check,#passageSelect,#previous,#next,#free,#choice').forEach(x=>x.disabled=false);$('previous').disabled=index===0;$('next').disabled=index===DATA.length-1;}};
$('passageSelect').innerHTML=DATA.map((p,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} · ${p.year}年度 第${p.session}回</option>`).join('');$('passageSelect').onchange=e=>{index=Number(e.target.value);render()};$('previous').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(index<DATA.length-1){index++;render()}};$('free').onclick=()=>setMode('free');$('choice').onclick=()=>setMode('choice');$('reveal').onclick=()=>{$('original').textContent='元のタイトル：'+DATA[index].title};$('connection').textContent='AI判定対応';if(IS_TITLE)$('modes').classList.add('hidden');render();
</script>
<script type="module">
import {enableAppCheck} from './firebase-security.js?v=2.1.2';
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut,
  onAuthStateChanged, setPersistence, browserLocalPersistence
} from "https://k-oota-pixel.github.io/english-playroom/auth-session.js?v=2.1.2";
import {
  getFirestore, doc, getDoc, setDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAllLjPcGhygMSEIORXhKZOaDjYvpSJ4EQ",
  authDomain: "eiken-retry.firebaseapp.com",
  projectId: "eiken-retry",
  storageBucket: "eiken-retry.firebasestorage.app",
  messagingSenderId: "231308672297",
  appId: "1:231308672297:web:5e8b8ede3a0246c2318b38",
  measurementId: "G-8CWR37L5K0"
};

const fbApp=initializeApp(firebaseConfig);
enableAppCheck(fbApp);
const auth=getAuth(fbApp);
const db=getFirestore(fbApp);
const provider=new GoogleAuthProvider();


const APP_ID="eiken-title";
const LOCAL_KEY="readinglab-eiken-title-progress-v1";
const loginBtn=document.getElementById("firebaseLogin");
const logoutBtn=document.getElementById("firebaseLogout");
const dot=document.getElementById("firebaseDot");
const label=document.getElementById("firebaseLabel");
const note=document.getElementById("firebaseNote");
let currentUser=null;

function todayKey(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function blank(){
  return {attemptedIds:[],submissions:0,correctAnswers:0,totalAnswers:0,positiveCount:0,lastPlayedDate:""};
}
function readLocal(){
  try{
    const d=JSON.parse(localStorage.getItem(LOCAL_KEY)||"{}");
    return {
      attemptedIds:Array.isArray(d.attemptedIds)?[...new Set(d.attemptedIds.filter(x=>typeof x==="string"))]:[],
      submissions:Math.max(0,Number(d.submissions)||0),
      correctAnswers:Math.max(0,Number(d.correctAnswers)||0),
      totalAnswers:Math.max(0,Number(d.totalAnswers)||0),
      positiveCount:Math.max(0,Number(d.positiveCount)||0),
      lastPlayedDate:typeof d.lastPlayedDate==="string"?d.lastPlayedDate:""
    };
  }catch{return blank();}
}
function writeLocal(s){localStorage.setItem(LOCAL_KEY,JSON.stringify(s));}
function cloudRef(user){return doc(db,"users",user.uid,"apps",APP_ID);}
function shortName(user){
  const n=(user?.displayName||"").trim();
  return n?(n.length>10?n.slice(0,10)+"…":n):"ログイン中";
}
function setUI(mode,text,sub){
  dot.className="firebase-dot"+(mode?` ${mode}`:"");
  label.textContent=text;note.textContent=sub||"";
}
function mergeStats(a,b){
  return {
    attemptedIds:[...new Set([...(a.attemptedIds||[]),...(b.attemptedIds||[])])],
    submissions:Math.max(Number(a.submissions)||0,Number(b.submissions)||0),
    correctAnswers:Math.max(Number(a.correctAnswers)||0,Number(b.correctAnswers)||0),
    totalAnswers:Math.max(Number(a.totalAnswers)||0,Number(b.totalAnswers)||0),
    positiveCount:Math.max(Number(a.positiveCount)||0,Number(b.positiveCount)||0),
    lastPlayedDate:[a.lastPlayedDate||"",b.lastPlayedDate||""].sort().pop()||""
  };
}
async function saveFull(s){
  if(!currentUser)return;
  setUI("busy",shortName(currentUser),"保存中…");
  await setDoc(cloudRef(currentUser),{
    attemptedIds:s.attemptedIds,
    attemptedCount:s.attemptedIds.length,
    submissions:s.submissions,
    correctAnswers:s.correctAnswers,
    totalAnswers:s.totalAnswers,
    positiveCount:s.positiveCount,
    lastPlayedDate:s.lastPlayedDate,
    clientUpdatedAt:Date.now(),
    serverUpdatedAt:serverTimestamp()
  },{merge:true});
  setUI("ok",shortName(currentUser),`☁ ${s.attemptedIds.length} / 17`);
}
async function syncOnLogin(user){
  const local=readLocal();
  const snap=await getDoc(cloudRef(user));
  let merged=local;
  let cloud={};
  if(snap.exists()){
    const c=snap.data()||{};
    cloud={
      attemptedIds:Array.isArray(c.attemptedIds)?c.attemptedIds:[],
      submissions:c.submissions,correctAnswers:c.correctAnswers,totalAnswers:c.totalAnswers,
      positiveCount:c.positiveCount,lastPlayedDate:c.lastPlayedDate
    };
    merged=mergeStats(local,cloud);
  }
  writeLocal(merged);
  const cloudIds=[...new Set(cloud.attemptedIds||[])].sort(),mergedIds=[...new Set(merged.attemptedIds||[])].sort();
  const needsUpload=!snap.exists()||JSON.stringify(cloudIds)!==JSON.stringify(mergedIds)||merged.submissions!==(Number(cloud.submissions)||0)||merged.correctAnswers!==(Number(cloud.correctAnswers)||0)||merged.totalAnswers!==(Number(cloud.totalAnswers)||0)||merged.positiveCount!==(Number(cloud.positiveCount)||0)||merged.lastPlayedDate!==(typeof cloud.lastPlayedDate==="string"?cloud.lastPlayedDate:"");
  if(needsUpload&&(merged.attemptedIds.length||merged.submissions||merged.totalAnswers||merged.lastPlayedDate))await saveFull(merged);
  else setUI("ok",shortName(user),`☁ ${merged.attemptedIds.length} / 17`);
}
window.readingLabCloud={
  async recordAttempt(info){
    window.EnglishPlayroomCoins?.awardTitle?.(info?.passageId);
    const s=readLocal();
    if(info?.passageId&&!s.attemptedIds.includes(info.passageId))s.attemptedIds.push(info.passageId);
    s.submissions+=1;
    s.lastPlayedDate=todayKey();
    if(Number.isFinite(Number(info?.correct)))s.correctAnswers+=Math.max(0,Number(info.correct));
    if(Number.isFinite(Number(info?.total)))s.totalAnswers+=Math.max(0,Number(info.total));
    if(["excellent","good"].includes(info?.verdict))s.positiveCount+=1;
    writeLocal(s);
    try{await saveFull(s);}
    catch(e){console.error(e);setUI("error",currentUser?shortName(currentUser):"Googleログイン","保存エラー");}
  }
};

loginBtn.addEventListener("click",async()=>{
  if(currentUser)return;
  loginBtn.disabled=true;setUI("busy","Googleを開いています…","認証中");
  try{await signInWithPopup(auth,provider);}
  catch(e){console.error(e);setUI("error","Googleログイン",e?.code==="auth/popup-blocked"?"ポップアップを許可":"再試行できます");loginBtn.disabled=false;}
});
logoutBtn.addEventListener("click",()=>signOut(auth));
try{await setPersistence(auth,browserLocalPersistence);}catch(e){console.error(e);}

onAuthStateChanged(auth,async user=>{
  currentUser=user||null;
  if(!user){
    logoutBtn.hidden=true;loginBtn.disabled=false;
    const s=readLocal();
    setUI("","Googleログイン",s.attemptedIds.length?`端末: ${s.attemptedIds.length} / 17`:"端末保存");
    return;
  }
  logoutBtn.hidden=false;loginBtn.disabled=true;setUI("busy",shortName(user),"進捗同期中…");
  try{await syncOnLogin(user);}
  catch(e){console.error(e);setUI("error",shortName(user),"同期エラー");}
  finally{loginBtn.disabled=false;}
});
</script>
